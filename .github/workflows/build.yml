name: Sestavit APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Když je v repozitáři "FiF - Find in Files.zip", rozbalí se a nahradí ostatní soubory projektu
      - name: Rozbalit zip s projektem
        run: |
          if [ -f "FiF - Find in Files.zip" ]; then
            rm -rf app gradle docs build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat
            unzip -o -q "FiF - Find in Files.zip" -x '.github/*'
            echo "Použit obsah FiF - Find in Files.zip"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: FiF - Find in Files
          path: app/build/outputs/apk/release/*.apk
