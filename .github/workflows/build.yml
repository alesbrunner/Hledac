name: Sestavit APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Když je v repozitáři DocHledac.zip, rozbalí se a nahradí ostatní soubory projektu
      - name: Rozbalit DocHledac.zip
        run: |
          if [ -f DocHledac.zip ]; then
            rm -rf app gradle docs build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat
            unzip -o -q DocHledac.zip -x '.github/*'
            echo "Použit obsah DocHledac.zip"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DocHledac-apk
          path: app/build/outputs/apk/release/*.apk
